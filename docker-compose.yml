version: '3.8'

services:
  app:
    build: .
    container_name: doctors-app
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      - PORT=3001
      - NODE_ENV=production
      - TZ=Asia/Kolkata
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
