name: Deploy Sand-box to Hostinger VPS

on:
  push:
    branches:
      - Sand-box

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            # Navigate to the project directory
            cd /home/ubuntu/Doctors-App
            
            # Fix git "dubious ownership" error
            sudo git config --global --add safe.directory /home/ubuntu/Doctors-App
            
            # Fetch latest changes and pull from Sand-box branch
            sudo git fetch origin
            sudo git checkout Sand-box
            sudo git pull origin Sand-box
            
            # Stop current containers, rebuild, and start in detached mode
            # We try both "docker compose" (V2) and "docker-compose" (V1)
            sudo docker compose down || sudo docker-compose down
            sudo docker compose up -d --build || sudo docker-compose up -d --build
