name: Deploy Sand-box to Oracle VM

on:
  push:
    branches:
      - Sand-box

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USERNAME }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            # Navigate to the project directory
            cd /home/ubuntu/Docker-app
            
            # Fetch latest changes and pull from Sand-box branch
            git fetch origin
            git checkout Sand-box
            git pull origin Sand-box
            
            # Stop current containers, rebuild, and start in detached mode
            docker-compose down
            docker-compose up -d --build
